{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trading-floor.fullname" . }}-frontend
  labels:
    {{- include "trading-floor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "trading-floor.selectorLabels" (dict "component" "frontend" "Release" .Release "Chart" .Chart) | nindent 4 }}
{{- end }}
